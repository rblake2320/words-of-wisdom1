# Standalone stack: app + TiDB (MySQL-compatible, matches the original
# production database so the guarded migrations behave identically).
# See docs/SELF_HOSTING.md for setup steps.
services:
  db:
    image: pingcap/tidb:v8.5.1
    ports:
      - "4000:4000"
    volumes:
      - tidb-data:/tmp/tidb
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "4000", "-u", "root", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root@db:4000/words_of_wisdom
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  tidb-data:
